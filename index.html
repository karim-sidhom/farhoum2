<style>
html,body{margin:0;height:100%;background:#0d1a6e;font-family:system-ui,sans-serif}
#map{position:absolute;inset:0}
#bar{position:absolute;top:10px;right:10px;z-index:1000;background:#0d1a6eE6;color:#fff;border:1px solid #d4af37;border-radius:10px;padding:8px 12px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:calc(100vw - 40px)}
#bar button,#bar select{background:#d4af37;color:#0d1a6e;border:0;border-radius:6px;padding:4px 8px;font-weight:700;cursor:pointer}
#cnt,#tcnt{font-weight:700;color:#d4af37}
/* ===== PWA: تحسينات الشكل ===== */
#bar{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 4px 16px rgba(0,0,0,.35);border-radius:14px;top:calc(10px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right))}
#bar button,#bar select{transition:transform .12s,filter .12s}
#bar button:active{transform:scale(.92)}
#bar button:hover{filter:brightness(1.1)}
#pwaBox,#pwaUpd{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));width:max-content;z-index:3000;display:none;align-items:center;gap:10px;background:linear-gradient(135deg,#0d1a6e,#020b2e);color:#fff;border:1px solid #d4af37;border-radius:16px;padding:10px 14px;box-shadow:0 8px 28px rgba(0,0,0,.5);max-width:calc(100vw - 24px);font-size:14px;animation:pwaUp .35s ease-out}
#pwaBox img{width:40px;height:40px;border-radius:10px;flex:none}
#pwaBox #pwaTxt{flex:1;min-width:0;line-height:1.35}
#pwaBox button{flex:none;white-space:nowrap}
#pwaBox button,#pwaUpd button{background:#d4af37;color:#0d1a6e;border:0;border-radius:8px;padding:6px 14px;font-weight:700;cursor:pointer;font-size:14px}
#pwaBox #pwaClose{background:transparent;color:#fff;padding:4px 8px;font-size:18px;opacity:.7}
@keyframes pwaUp{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}

.ala-poi{font-size:18px;line-height:24px;text-align:center;background:#fff;border:2px solid #1fb35a;border-radius:50%;box-shadow:0 1px 4px #0008}
.ala-poi.pray{background:#2ee66b;border-color:#0b8a3a;box-shadow:0 0 0 3px #2ee66b66,0 0 14px 6px #2ee66bcc;animation:alaPray 1.6s ease-in-out infinite}@keyframes alaPray{50%{box-shadow:0 0 0 6px #2ee66b44,0 0 22px 10px #2ee66b99}}
.rc{width:38px;height:38px;border-radius:50%;border:3px solid #fff;color:#fff;font:700 12px/32px system-ui,sans-serif;text-align:center;box-shadow:0 1px 5px #000a}
.rc.g{background:#1fb35a}.rc.o{background:#f39c12}.rc.r{background:#e02424;animation:rp 1s infinite}
.rc.stale{opacity:.55}
.rc.sk{font-size:22px;line-height:32px;animation:skb .6s infinite}
@keyframes skb{0%,100%{opacity:1;box-shadow:0 0 16px 5px #ff0000}50%{opacity:.25;box-shadow:0 0 0 12px #e0242400}}
@keyframes rp{0%,100%{box-shadow:0 0 0 0 #e02424aa}50%{box-shadow:0 0 0 12px #e0242400}}
/* ===== secousse violente = SOS : cercle rouge + HELP qui se propage en boucle ===== */
.rc.sos{position:relative;overflow:visible;font:900 10px/32px system-ui,sans-serif;letter-spacing:.3px;background:#e02424}
.rc.sos .hp{position:absolute;left:50%;top:50%;width:38px;height:38px;margin:-19px 0 0 -19px;box-sizing:border-box;border-radius:50%;border:1.5px solid #e02424;color:#e02424;font:900 11px/35px system-ui,sans-serif;text-align:center;opacity:0;pointer-events:none;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 6px #fff;animation:hpOut 2.4s ease-out infinite}
@keyframes hpOut{0%{transform:scale(.9);opacity:.95}100%{transform:scale(4.2);opacity:0}}
.risk-panel{position:absolute;left:10px;bottom:10px;z-index:1000;background:#0d1a6eE6;color:#fff;border:1px solid #d4af37;border-radius:10px;padding:8px 12px;font-size:13px;max-width:min(360px,calc(100vw - 40px));max-height:40vh;overflow:auto;direction:rtl}
.risk-panel b{color:#d4af37}.risk-panel .r{padding:2px 0;border-bottom:1px solid #ffffff22}.risk-panel .hi{color:#ff5a5a;font-weight:700}
.train-label{background:#0d1a6e;color:#fff;border:1px solid #d4af37;font-weight:700;font-size:11px;padding:1px 4px}


/* ===== موقعي: نقطة زرقاء للمستخدم الحالي ===== */
.me-dot{position:relative;width:18px;height:18px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 2px #1a73e8,0 1px 6px #000a}
.me-dot::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid #1a73e8;animation:mePulse 1.8s ease-out infinite}
@keyframes mePulse{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.8);opacity:0}}
#meToast{position:fixed;left:50%;transform:translateX(-50%);top:calc(70px + env(safe-area-inset-top));z-index:3500;background:#0d1a6eF2;color:#fff;border:1px solid #d4af37;border-radius:12px;padding:8px 14px;font-size:13px;max-width:calc(100vw - 32px);text-align:center;display:none;direction:rtl}
/* ===== معتمدية / ولاية : مؤشر العبور ===== */
#zonePill{position:absolute;z-index:1001;right:10px;max-width:calc(100vw - 20px);direction:rtl;background:#0d1a6eEE;color:#fff;border:1px solid #d4af37;border-radius:12px;padding:6px 12px;font-size:13px;line-height:1.45;box-shadow:0 4px 16px rgba(0,0,0,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;pointer-events:none;transition:background .25s,border-color .25s}
#zonePill .zl{opacity:.75;font-size:11px;margin-inline-end:4px}
#zonePill b{color:#d4af37}
#zonePill small{opacity:.8;font-size:11px;direction:ltr;unicode-bidi:isolate;margin-inline-start:4px}
#zonePill .zc{display:none;margin-top:4px;padding-top:4px;border-top:1px solid #ffffff44;font-weight:700}
#zonePill.chg-d{animation:zoneFlash .9s ease-out}
#zonePill.chg-g{background:#b3261eF2;border-color:#fff;animation:zoneFlash 1.2s ease-out}
#zonePill.chg-g b{color:#fff}
#zonePill.chg-d .zc,#zonePill.chg-g .zc{display:block}
@keyframes zoneFlash{0%{transform:scale(1.12)}100%{transform:scale(1)}}
</style>

  // on ne retape donc que l'heure de départ de chaque train (recopiée une par une depuis l'affiche), le reste
  // est calculé automatiquement, ce qui élimine tout risque d'erreur de recopie sur les ~230 arrêts générés.
  const list = [];
  function addMin(hhmm, m){ return minsToHHMM(minutesOf(hhmm)+m); }

    departures.forEach((dep, i)=>{

      list.push({id: prefix+num, name: num+' — '+dirLabel, stopsText});

  }

    const A=coords[i], B=coords[i+1];
    const t = projectT(pt,A,B);
    const px = A[0]+(B[0]-A[0])*t, py = A[1]+(B[1]-A[1])*t;
    const d = haversine(pt,[px,py]);

    const q = kz_nearestOnTrackRLPoint(lat, lon, null);

function darkenHex(hex, amt){
  hex = (hex||'#e60000').replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const n = parseInt(hex,16);
  let r = Math.max(0,((n>>16)&255) + amt);
  let g = Math.max(0,((n>>8)&255) + amt);
  let b = Math.max(0,(n&255) + amt);
  return '#'+[r,g,b].map(v=>Math.min(255,Math.round(v)).toString(16).padStart(2,'0')).join('');
}

function haversine(a,b){

function nearestOnTrack(pt, coords){

    const segLen=haversine(A,B);
    // project pt onto segment A-B (approx, planar since distances small)
    const t = projectT(pt,A,B);
    const px = A[0]+(B[0]-A[0])*t, py = A[1]+(B[1]-A[1])*t;
    const d = haversine(pt,[px,py]);
    if(d<best.dist){ best={dist:d, trackDist: cum + segLen*t}; }

  }

function projectT(p,a,b){

  let t=((px-ax)*dx+(py-ay)*dy)/len2;

var SHAKE_TEST=/[?&#]testshake/.test(location.href);
var glide={};
function glideTo(key,u,m,c){
  var g=glide[key], now=performance.now();
  if(!g){ glide[key]=g={lat:u.lat,lon:u.lon,tlat:u.lat,tlon:u.lon,flat:u.lat,flon:u.lon,t0:now,dur:1000,last:now,m:m,c:c}; return; }
  if(m) g.m=m; if(c) g.c=c;
  if(u.lat===g.tlat&&u.lon===g.tlon) return;
  var dt=now-g.last; g.last=now;
  g.flat=g.lat; g.flon=g.lon; g.tlat=u.lat; g.tlon=u.lon; g.t0=now;
  g.dur=Math.min(4000,Math.max(600,dt));
  /* même comportement que la voiture : position appliquée immédiatement, sans glissement */
  g.flat=u.lat; g.flon=u.lon; g.lat=u.lat; g.lon=u.lon;
  if(g.m) g.m.setLatLng([u.lat,u.lon]); if(g.c) g.c.setLatLng([u.lat,u.lon]);
  if(!glide._raf) glide._raf=requestAnimationFrame(glideStep);
}
function glideStep(){
  var now=performance.now(), busy=false;
  Object.keys(glide).forEach(function(k){
    if(k==='_raf') return;
    var g=glide[k]; if(!userMarkers[k]){ delete glide[k]; return; }
    var f=Math.min(1.5,(now-g.t0)/g.dur);
    g.lat=g.flat+(g.tlat-g.flat)*f; g.lon=g.flon+(g.tlon-g.flon)*f;
    if(g.m) g.m.setLatLng([g.lat,g.lon]); if(g.c) g.c.setLatLng([g.lat,g.lon]);
    if(f<1.5) busy=true;
  });
  glide._raf=busy?requestAnimationFrame(glideStep):null;
}

  /* ===== F2-BRIDGE : farhoum2 répond à Farhoum (iframe invisible ?bridge=1) pour TOUTE recherche : pizza, sandwich, mosquée, pharmacie, café… ===== */
  var F2_FROM=/^https:\/\/([a-z0-9-]+\.)?kieda\.online$/;

  function f2Filter(mod){

  function f2Food(mod,zone,keys,bud,a){
